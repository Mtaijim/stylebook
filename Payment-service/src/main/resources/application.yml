server:
  port: 5005
spring:
  application:
    name: booking-service
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:mysql://localhost:3310/bookingService_db
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    show-sql: true


eureka:
  instance:
    hostname: localhost
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"

razorpay:
  api:
    key: "Your razorpay api key"
    secret: "your razorpay api secret"

stripe:
  api:
    key: "you stripe key "