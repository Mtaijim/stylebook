services:
  mysql:
    image: mysql:8.4
    container_name: paymentService-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paymentService_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password

    ports:
      - "3312:3306"

    volumes:
      - paymentService_mysql_data:/var/lib/mysql

volumes:
  paymentService_mysql_data: