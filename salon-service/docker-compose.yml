services:
  mysql:
    image: mysql:8.4
    container_name: salonService-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salonService_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password

    ports:
      - "3308:3306"

    volumes:
      - salonService_mysql_data:/var/lib/mysql

volumes:
  salonService_mysql_data: