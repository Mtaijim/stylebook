services:
  mysql:
    image: mysql:8.4
    container_name: categoryService-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: categoryService_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password

    ports:
      - "3309:3306"

    volumes:
      - categoryService_mysql_data:/var/lib/mysql

volumes:
  categoryService_mysql_data: