services:
  mysql:
    image: mysql:8.4
    container_name: userService-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userService_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password

    ports:
      - "3307:3306"

    volumes:
      - userService_mysql_data:/var/lib/mysql

volumes:
  userService_mysql_data: