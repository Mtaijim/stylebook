services:
  mysql:
    image: mysql:8.4
    container_name: bookingService-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookingService_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password

    ports:
      - "3310:3306"

    volumes:
      - bookingService_mysql_data:/var/lib/mysql

volumes:
  bookingService_mysql_data: